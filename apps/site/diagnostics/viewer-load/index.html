<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Viewerの連続読込検査 | 3DSL</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#0d1116;color:#eef2f4}
*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px 14px 32px}
h1{font-size:clamp(1.35rem,4.9vw,1.9rem);margin:0 0 8px}p{margin:6px 0 12px}
button{font:inherit;border:1px solid #627584;border-radius:6px;background:#1c2934;color:inherit;padding:8px 16px;min-height:44px}
button:first-child{background:#a7e1eb;color:#102127;border-color:#a7e1eb;font-weight:650}
button:disabled{opacity:.5}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#status{font-weight:650;min-height:1.6em}.hint{color:#bdc9d1;font-size:.9rem}#frame iframe{display:block;width:100%;height:clamp(290px,51svh,560px);border:1px solid #435462;border-radius:6px}
ol{padding-left:1.8em}li{margin:.35em 0}textarea{width:100%;min-height:8rem;background:#151e25;color:inherit;font:inherit;border:1px solid #536370;border-radius:5px;padding:.55rem}details{margin:12px 0}a{color:#a7e1eb}
[hidden]{display:none!important}
</style>
</head>
<body><main>
<h1>Viewerの連続読込検査</h1>
<p>小型の図、大型の図3回、小型の図を同じViewerで開きます。4回目に図を指で回してください。</p>
<div class="actions"><button type="button" id="run">計測を始める</button><button type="button" id="stop" hidden>中止</button><button type="button" id="next" hidden>次へ</button></div>
<p id="status" role="status">開始すると検査用の素材を読み込みます。</p>
<div id="frame"></div><ol id="steps"></ol>
<button type="button" id="copy" hidden>結果をコピー</button>
<label id="fallback" hidden>結果を選択してコピー<textarea id="text" readonly></textarea></label>
<details><summary>計測条件</summary>
<p class="hint">小型は512三角形と256px角の画像、大型は131,072三角形と2,048px角の画像です。描画と回転の結果はこの端末にだけ記録します。画面を離れた場合は中断として表示します。</p>
<p class="hint">端末メモリ（PSS）はPCからのUSB計測で取得します。</p></details>
<noscript>計測にはJavaScriptが必要です。</noscript>
</main>
<script type="application/json" id="fixtures">VIEWER_LOAD_FIXTURES</script>
<script type="module" src="./run.js"></script>
</body></html>
