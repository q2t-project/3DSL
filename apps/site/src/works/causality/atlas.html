.workTitle{min-width:0}.workTitle span{display:block;color:#445955;font-size:13px;line-height:1.4}#extras a{color:#1e6059;text-underline-offset:2px}#extras li{margin-bottom:10px}@media(max-width:730px){.workTitle{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px}.workTitle span{font-size:11px}}</style></head><body><div id="app"><header><div class="workTitle"><h1>因果アトラス</h1><span>一つの点灯から、確率と自由意志へ</span></div><div id="controls"><select id="list" aria-label="概念を選択"></select><button id="minus" aria-label="縮小">−</button><button id="plus" aria-label="拡大">＋</button><button id="home">全景</button><button id="mobileinfo" aria-label="案内">案内</button></div></header><nav id="entry" aria-label="全景からたどる"></nav><main><section id="scene" aria-label="三次元モデル"><canvas tabindex="0" aria-label="矢印キーで回転、プラスとマイナスで拡大縮小、Homeで全景。概念一覧でも移動できる。"></canvas><div id="hint">ドラッグで回転 · 右ドラッグ／2本指で移動 · ホイール／ピンチで拡縮</div></section><aside id="panel"><div id="routeNav" hidden><div id="routeCount"></div><div id="stepButtons"><button id="prevStep">前へ</button><button id="nextStep">次へ</button></div></div><button id="close" hidden>閉じる</button><h2 id="pTitle" aria-live="polite"></h2><p id="pBody"></p><div id="extras"></div><div id="links"></div></aside></main></div><script type="application/json" id="model">{"title":"因果アトラス","subtitle":"一つの点灯から、確率と自由意志へ","version":"1.7.0","uuid":"94b674b0-4336-46ef-8942-ec8c730f92f7","created_at":"2026-11-16T09:43:31Z","axes":["X　＋側に装置・行為・結果、−側に観察・推論・説明する立場を置く。点の名前は対象、線の言葉は対象間の関係を示す。","Y　出来事は＋Yに進む。結果の評価時点は一つ。認識側では手順や問いの順でたどる。将来→今→過去の破線は未来の言明を遡って吟味する向き。過去・今・将来の列では存在側と時点をそろえる。","Z　装置側では出来事の記述から状態値・結果の分布・点灯率の差へ移る。高さは実測値の大小を表さない。認識側では対象についての判断や仮定の層を示す。行為・介入・観察の文字は＋Xを正面、＋Yを上にそろえる。"],"references":[{"title":"ジューディア・パール、ダナ・マッケンジー著、松尾豊監修・解説、夏目大訳『因果推論の科学 「なぜ？」の問いにどう答えるか』文藝春秋、2022年。ISBN 978-4-16-391596-8。観察・介入・反事実の区別を、同じ点灯をめぐる三つの問いに反映。とくに第7章・第8章の介入と反事実を参照。","links":[{"label":"文藝春秋の書籍情報","url":"https://books.bunshun.jp/ud/book/num/9784163915968"}]},{"title":"ダグラス・クタッチ著、相松慎也訳、一ノ瀬正樹解説『因果性』（現代哲学のキーコンセプト）岩波書店、2019年。ISBN 978-4-00-061380-4。産出的因果と差異形成的因果の区別を、点灯の仕組みを追う問いと、操作が結果に差をもたらすかを調べる問いに反映。確率上昇説も参照。","links":[{"label":"書籍情報・目次","url":"https://www.hanmoto.com/bd/isbn/9784000613804"}]},{"title":"イアン・ハッキング著、広田すみれ・森元良太訳『確率の出現』慶應義塾大学出版会、2013年。ISBN 978-4-7664-2103-3。事象の起こりやすさと、証拠に照らした判断の確からしさを、図の存在側と認識側に対応させました。二つの意味が歴史的に結びついた経緯も参照。","links":[{"label":"慶應義塾大学出版会の書籍情報","url":"https://www.keio-up.co.jp/book/b10163918.html"},{"label":"原著第2章 “Duality”","url":"https://www.cambridge.org/core/books/abs/emergence-of-probability/duality/B840DF3AF051ED5EF26B285A80C252C7"},{"label":"原著第9章 “The art of thinking (1662)”","url":"https://www.cambridge.org/core/books/abs/emergence-of-probability/art-of-thinking-1662/691DA5443B294269A647BAB562B7347C"}]},{"title":"Jin Tian and Judea Pearl, “A General Identification Condition for Causal Effects,” AAAI, 2002. データと仮定から介入効果が定まるかを問う「識別」の説明を照合。","links":[{"label":"論文PDF","url":"https://cdn.aaai.org/AAAI/2002/AAAI02-085.pdf"}]},{"title":"Hugh Rice, “Fatalism,” Stanford Encyclopedia of Philosophy, Summer 2024 Edition, §§1–3. 将来の言明の真偽と結末の必然性をめぐる論理的運命論を参照。","links":[{"label":"論理的運命論の記事","url":"https://plato.stanford.edu/archives/sum2024/entries/fatalism/"}]},{"title":"David Hunt and Linda Zagzebski, “Foreknowledge and Free Will,” Stanford Encyclopedia of Philosophy, Spring 2026 Edition, §4. 海戦の例と、将来についての言明が真だということから不可避性を導けるかという論点を参照。","links":[{"label":"予知と自由意志の記事","url":"https://plato.stanford.edu/archives/spr2026/entries/free-will-foreknowledge/"}]},{"title":"Carl Hoefer, “Causal Determinism,” Stanford Encyclopedia of Philosophy, Summer 2026 Edition. 世界の状態と法則から後続が一意に定まるという決定論の定義と、予測可能性との区別を照合。","links":[{"label":"決定論の記事","url":"https://plato.stanford.edu/archives/sum2026/entries/determinism-causal/"}]},{"title":"Michael McKenna and D. Justin Coates, “Compatibilism,” Stanford Encyclopedia of Philosophy, Summer 2024 Edition. 決定論と自由意志の両立可能性、および本人の理由に応じた行為の統制を参照。","links":[{"label":"両立論の記事","url":"https://plato.stanford.edu/archives/sum2024/entries/compatibilism/"}]},{"title":"Andrea Falcon, “Aristotle on Causality,” Stanford Encyclopedia of Philosophy, Spring 2023 Edition, §§2–5. 「何のためか」という説明の位置づけと、目的による説明が人の意図を越えて論じられてきた範囲を照合。","links":[{"label":"アリストテレスの因果論の記事","url":"https://plato.stanford.edu/archives/spr2023/entries/aristotle-causality/"}]}],"nodes":[{"id":"o","label":"原点","xyz":[0,0,0],"size":8,"group":"座標","color":"#AAB8C5","detail":"存在と認識が向かい合う共通原点。左右の局所原点までの間隔は配置の基準。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"11456dbb-22b4-51be-a29f-f65336763353"},{"id":"w","label":"存在","xyz":[180,0,0],"size":8,"group":"座標","color":"#AAB8C5","detail":"出来事が起きる側の局所原点。種類や対象をX、進行をY、状態や結果を量として扱う段階をZから読む。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"223170d5-7eb8-53c3-b986-e27c493d88d2"},{"id":"k","label":"認識","xyz":[-180,0,0],"size":8,"group":"座標","color":"#AAB8C5","detail":"観測者・行為者から読む局所原点。形式φは原点方向、機能ψは＋Y、意味μは＋Z。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"b253104e-6413-56ba-8411-415794a3e899"},{"id":"condition","label":"作動条件","xyz":[180,0,48],"size":8,"group":"出来事","color":"#FFC18A","detail":"ランプの電路を閉じる条件。Aではスイッチ位置X、Bでは制御指令Uで決まる。因果モデルによって同じ観察への説明が分かれる。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"2fd8be9b-cf30-5e92-ad37-4cd2a7e5e7ff"},{"id":"cause","label":"原因","xyz":[108,0,48],"size":16,"group":"出来事","color":"#FFC18A","detail":"原因は結果との関係で決まる役割。モデルAでは、スイッチを入れることがランプを点灯させる。モデルBではスイッチ位置と点灯が観察上一致していても、スイッチを動かすことは点灯の原因にならない。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"02492eee-ed97-5d8b-a29b-3a2e5ed15771"},{"id":"mech","label":"機構","xyz":[180,96,48],"size":8,"group":"出来事","color":"#FFC18A","detail":"点灯を生む仕組み。Aはスイッチの接点がランプの電路を開閉する。Bは制御指令がランプの電路を直接開閉し、スイッチは別回路で同じ指令に追従する。どちらでも通常運転の記録は一致する。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"cd689c22-2f79-5615-a3d4-14ddea9e920c"},{"id":"out","label":"結果","xyz":[108,208,48],"size":16,"group":"出来事","color":"#FFC18A","detail":"評価対象は「操作から一定時間後に、このランプが灯っているか（Y）」で統一する。観察・介入・この一例の反事実で点を共有する。誰の、どの条件の値かは各経路で読み分ける。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"7c3e2b54-c5c6-5d79-8093-d936be48836c"},{"id":"obs","label":"観察","xyz":[-60,208,48],"size":8,"group":"認識","color":"#9DD8EF","detail":"スイッチ位置Xと一定時間後の点灯Yを、通常運転のまま観察する。AでもBでもX=1で観察された事例のYはすべて1。この一致はXを外部から動かした場合の答えまで保証しない。 個別の手動操作では、実際の指令・操作・点灯を記録し、この一回についての反事実の条件とする。","plane":"YZ","front":"+X","up":"+Y","vertical":true,"uuid":"16984f75-8f3d-5d90-9026-a50a1480377e"},{"id":"rec","label":"記録","xyz":[-180,208,48],"size":8,"group":"認識","color":"#9DD8EF","detail":"同じ装置について、観察したスイッチ位置、定めた時間後の点灯、操作の有無、測定条件を対にして残す。通常運転の記録と強制操作の記録は区別する。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"bb9e6024-7eb3-5580-8f2d-ef02e3f0c81f"},{"id":"ev","label":"証拠","xyz":[-180,208,132],"size":8,"group":"認識","color":"#9DD8EF","detail":"どの命題を支える証拠かを明示する。通常の同時記録は「XとYが一致した」ことを支える。強制操作したときにも一致するという主張には別の根拠が要る。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"ef082a40-322e-595a-9444-5812c2c5ba84"},{"id":"freq","label":"頻度","xyz":[-180,304,48],"size":8,"group":"確率","color":"#BFE8A2","detail":"スイッチ位置ごとの対象数と、評価時点で点灯した件数から頻度を出す。誰を分母にしたか、通常運転か強制操作か、次の集団にも当てはまるかを区別する。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"23cf9e34-9d15-5b8c-a93b-3a63c93c6a0f"},{"id":"est","label":"推定","xyz":[-180,304,132],"size":4,"group":"認識","color":"#9DD8EF","detail":"指定した集団での点灯率と、その見積もりの不確かさを観察や実験の資料から評価する。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"7e21fef3-7813-56b5-bbed-00f05c2436d9"},{"id":"p","label":"確率","xyz":[0,96,132],"size":16,"group":"確率","color":"#BFE8A2","detail":"同じランプでも、同じ条件を繰り返したとき灯りやすいかと、証拠からいま灯っているとどれほど確信できるかを分けて問える。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"95be1c6a-ec88-5483-9b9e-07fb695e7821"},{"id":"chance","label":"起こりやすさ","xyz":[108,96,132],"size":8,"group":"確率","color":"#BFE8A2","detail":"偶然的確率。指定した条件・背景分布のもとで点灯がどれほど起きやすいか。例の通常運転では指令Uのオンとオフを同数とする。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"02241670-c8fd-5b8f-8ca1-9edbdc71c2e3"},{"id":"cred","label":"確からしさ","xyz":[-180,96,132],"size":8,"group":"確率","color":"#BFE8A2","detail":"認識的確率。手元の証拠が「ランプが灯っている」という判断をどの程度裏づけるか。点灯を確かめれば、同じ一回についての確信を更新できる。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"4ffc59e7-91fd-58f2-ab85-18a5213ff636"},{"id":"inference","label":"因果推論","xyz":[-180,0,48],"size":16,"group":"認識","color":"#9DD8EF","detail":"同じランプについて、通常運転での一致、スイッチを操作した場合、実際と別の操作をした場合を区別する。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"fd09c0f3-a01c-5b72-91b7-d896133b2695"},{"id":"assume","label":"仮定","xyz":[-180,0,132],"size":8,"group":"認識","color":"#9DD8EF","detail":"どんな背景・機構を保ち、何を変更するか。AはY=X、BはY=U。観察資料だけで両方が可能なら効果は定まらない。スイッチへの無作為な割付などは、介入効果を識別する別の根拠になりうる。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"8381710d-8571-507c-9fbf-9421a7357ab6"},{"id":"inter","label":"介入","xyz":[-60,0,132],"size":8,"group":"認識","color":"#9DD8EF","detail":"他の背景を保ち、通常なら指令Uに従うスイッチ位置Xを、外部から指定値に固定する。Xが原因候補である段階でも介入は定義できる。","plane":"YZ","front":"+X","up":"+Y","vertical":true,"uuid":"864168e8-93b0-5d40-bb72-4769730dfb50"},{"id":"cf","label":"反事実","xyz":[-60,208,132],"size":8,"group":"認識","color":"#9DD8EF","detail":"実際に指令オン（U=1）を記録し、人が操作して点灯した一回（X=Y=1）で、スイッチを切っていたら、同じ評価時点に灯ったか。U=1を保つとAは消灯、Bは点灯。反事実の結果も同じ「結果」点で読む。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"9fb885cf-bb9e-5d9e-b42c-f1915b06f226"},{"id":"purpose","label":"目的","xyz":[-180,-100,48],"size":8,"group":"行為と自由","color":"#DCC2FF","detail":"行為者が実現を目指す状態。この人は部屋を明るくしようとしていた。点灯に失敗しても目的はあったし、予見した電力消費まで目的になるわけではない。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"3ae28ca4-4110-5c39-b197-59df319559ba"},{"id":"act","label":"行為","xyz":[108,-100,48],"size":16,"group":"行為と自由","color":"#DCC2FF","detail":"一人が部屋を明るくするため、操作盤のスイッチを入れた。同じ行為について、目指した状態、身体の動き、点灯への寄与、行為者の統制、点灯を避けられたかを問える。","plane":"YZ","front":"+X","up":"+Y","vertical":true,"uuid":"661569c8-9de3-5e51-9e43-61d249054c6b"},{"id":"free","label":"自由意志","xyz":[-210,-280,48],"size":16,"group":"行為と自由","color":"#DCC2FF","detail":"どうすれば選択と行為をその人に帰属できるか。本人が理由に応じて制御できたか、別様に選べたか、これらが自由に必須かを問う。偶然に選択が変わるだけでは本人の統制は示せない。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"ab0dcf10-fb9a-53e8-8412-a35ce8cf7b11"},{"id":"det","label":"決定論","xyz":[-210,-100,132],"size":16,"group":"世界についての立場","color":"#9DD8EF","detail":"同じ完全な先行状態と法則を固定すると後続は一意に定まる、という立場。観測者が行為を予見できるか、スイッチの操作が点灯に寄与するかはそれぞれ別の問い。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"bc713eb1-2e0e-5e47-9b14-8fb8ca693d7d"},{"id":"compat","label":"両立論","xyz":[-316,-280,132],"size":8,"group":"両立可能性への答え","color":"#DCC2FF","detail":"決定論と自由意志は両立しうる。本人自身の理由に応じて制御された選択に自由を認める考え方などがある。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"9de4a48f-2f95-53ba-96b4-cf86eca904bf"},{"id":"incompat","label":"非両立論","xyz":[-104,-280,132],"size":8,"group":"両立可能性への答え","color":"#DCC2FF","detail":"決定論と自由意志の両立を否定する。この立場には決定論を退けて自由を認める考え方も含まれる。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"91b35fcc-d524-5176-9489-857e39905089"},{"id":"fate","label":"運命論","xyz":[-350,-100,132],"size":8,"group":"世界についての立場","color":"#9DD8EF","detail":"対象とする行為や結末を別様にする余地がないという立場。ここでは特定の点灯は避けられたかを取り上げる。将来→今→過去は、未来言明を使う論理的運命論の問い方。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"focusIds":["fateFuture","fateNow","fatePast"],"uuid":"c498c6eb-3cca-5b43-9b5e-1ca5d9c555ec"},{"id":"mechanism","label":"機械論","xyz":[-180,-200,48],"size":8,"group":"説明の立場","color":"#9DD8EF","detail":"行為・過程を構成部分の働きから説明する立場。この行為については神経から筋への信号と手指の運動が、スイッチをどう動かしたかを説明する。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"ee848a21-b24f-5bbb-8bea-20914f96d5cf"},{"id":"telos","label":"目的論","xyz":[-180,-100,132],"size":8,"group":"説明の立場","color":"#9DD8EF","detail":"何のための行為・過程だったかを目的から説明する立場。この局所ではスイッチを入れた行為の目的を扱う。生物の形や機能への目的論には意識的な意図を前提としない議論もある。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"bb92dc6f-3f2d-5701-9d26-ea5abfa418be"},{"id":"hist","label":"確率概念の成立","xyz":[0,96,216],"size":4,"group":"確率","color":"#BFE8A2","detail":"ハッキングがたどる17世紀の成立史。反復して現れる傾向を扱う伝統と、徴候・証言から判断する伝統が確率という一語に集まる。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"89dc3c92-20fd-5bb9-8de5-bb8ada357401"},{"id":"forecast","label":"結果の分布","xyz":[108,208,132],"size":8,"group":"確率","color":"#BFE8A2","detail":"定めた条件の下で結果Yに与える分布。この一回の背景が確定し、機構が決定的なら、反事実の結果は一つの値に集中する。集団では背景Uの分布を保ったまま各介入時の分布を求める。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"b1814df3-01ba-5409-a145-1f1542ca52de"},{"id":"evidence","label":"資料","xyz":[-180,96,48],"size":8,"group":"認識","color":"#9DD8EF","detail":"通常運転で指令Uは0と1が半々、スイッチ位置X=U。ランプはモデルAではY=X、モデルBではY=U。通常運転ではどちらでもXとYが常に一致し、同じ観察資料が得られる。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":"5caa64d8-709f-5f16-ab21-dc67c399f274"},{"id":"fateFuture","label":"将来","xyz":[-350,208,48],"size":8,"plane":"XZ","front":"+Y","up":"+Z","vertical":false,"group":"時間をめぐる問い","color":"#DCC2FF","detail":"将来の指定時刻にこのランプが点いている、という結末を仮定する。存在側の「結果」と評価時刻をそろえてある。起きたことから、それが不可避だったかを問う。","uuid":"fe222a4a-d349-5844-856c-1a99af7b3b63"},{"id":"fateNow","label":"今","xyz":[-350,-100,48],"size":8,"plane":"XZ","front":"+Y","up":"+Z","vertical":false,"group":"時間をめぐる問い","color":"#DCC2FF","detail":"スイッチを入れたのと同じ「今」。本人がいま何を目指すかと、この時点で将来の点灯を避ける余地があるかを区別する。","uuid":"7e0af829-fbec-5313-8698-57f5413b2a66"},{"id":"fatePast","label":"過去","xyz":[-350,-390,48],"size":8,"plane":"XZ","front":"+Y","up":"+Z","vertical":false,"group":"時間をめぐる問い","color":"#DCC2FF","detail":"過去になされた未来言明がすでに真だったとしたら、その内容まで必然だったといえるか。真理と必然性の関係が論証の争点。","uuid":"c0e8c075-0424-53d1-8a5d-bef9f86863ad"},{"id":"response","label":"応答","xyz":[180,96,132],"size":4,"group":"確率","color":"#BFE8A2","detail":"作動条件を与えたときの応答の値。点灯の有無なら1または0。条件ごとの応答を集約すれば、集団での点灯の起こりやすさを表せる。","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"uuid":null},{"color":"#FFC18A","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"id":"candidate","label":"原因候補","xyz":[108,0,132],"size":8,"group":"出来事","detail":"Xは実際にオン／オフを強制できるスイッチ位置。観察時は自動指令Uに追従する。Xの変更がYに効くかはモデルに依存する。"},{"color":"#FFC18A","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"id":"common","label":"共通原因","xyz":[180,0,132],"size":8,"group":"出来事","detail":"モデルBの制御指令Uはスイッチ位置Xとランプの作動条件の両方を決める。通常の観察ではXと点灯Yが一致する。Xだけを設定するとUからXへの決まり方が外れる。"},{"color":"#FFC18A","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"id":"operation","label":"作動","xyz":[180,208,48],"size":8,"group":"出来事","detail":"モデルAではスイッチの接点が電路を閉じる。モデルBでは指令がランプの電路を直接閉じる。いずれも同じランプの同じ時点の点灯を調べる。"},{"color":"#FFC18A","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"id":"effect","label":"因果効果","xyz":[108,208,216],"size":8,"group":"確率","detail":"同じ対象集団の同じ時点で、Xを1に固定したときの点灯率から0に固定したときの点灯率を引く。モデルAは1−0=1、Bは1/2−1/2=0。一人の観察結果や介入後だけの点灯率とは区別する。"},{"color":"#9DD8EF","plane":"XZ","front":"+Y","up":"+Z","vertical":false,"id":"identify","label":"識別","xyz":[-180,208,216],"size":8,"group":"認識","detail":"資料と仮定に合うモデルのすべてで、求めたい効果が同じ値になるか。通常運転の記録だけでは、Aの効果1とBの効果0を選べない。適切な無作為割付などにより、機構を完全には決めずに効果が求まる場合がある。"},{"id":"motor","label":"手指の運動","xyz":[108,-200,48],"group":"行為と自由","detail":"この事例では、信号を受けた指の筋が収縮し、指がスイッチを押し込んだ。意図した同一の行為を身体の働きから説明する。","size":8,"color":"#DCC2FF","plane":"XZ","front":"+Y","up":"+Z","vertical":false},{"id":"choice","label":"選択","xyz":[108,-280,48],"group":"行為と自由","detail":"スイッチを入れるか、そのままにするか。行為前の選択が本人の理由に応じたものだったかと、操作でランプが点くかは別に調べる。","size":8,"color":"#DCC2FF","plane":"XZ","front":"+Y","up":"+Z","vertical":false},{"id":"compatQ","label":"両立可能性","xyz":[-210,-280,132],"group":"行為と自由","detail":"同じ完全な先行状態と法則で行為が定まっても、その選択を自由と呼べるか。一つの問いに対する二つの答えをX方向に並べた。","size":8,"color":"#DCC2FF","plane":"XZ","front":"+Y","up":"+Z","vertical":false}],"edges":[{"from":"o","to":"w","label":"対象をたどる","kind":"meta.reference","detail":"対象をたどる","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"o","to":"k","label":"知る側をたどる","kind":"meta.reference","detail":"知る側をたどる","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"w","to":"condition","label":"範囲を決め orecast","label":"各結果に配分","kind":"meta.reference","detail":"各結果に配分","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"forecast","to":"out","label":"特定できるか","kind":"meta.reference","detail":"分布は決まっても、次の個別結果は一般に決まらない。「決まる」と「予見できる」も異なる。","sense":"a_to_b","major":true,"color":"#A7B8C8","legend":"参照・説明","style":"dashed","opacity":1},{"from":"hist","to":"p","label":"二義が結びつく","kind":"meta.reference","detail":"二義が結びつく","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"assume","to":"inference","label":"識別を支える","kind":"logical.support","detail":"識別を支える","sense":"a_to_b","legend":"根拠","style":"dashed","color":"#B6D994","opacity":0.78},{"from":"act","to":"cause","label":"働きかける","kind":"dynamic.influence","detail":"行為者がスイッチを入れ、比較の対象となる要因の値を変える。点灯に効くかは回路の構造に依存する。","sense":"a_to_b","legend":"働きかけ","style":"solid","color":"#EDC995","opacity":0.78},{"from":"rec","to":"evidence","label":"利用する","kind":"meta.reference","detail":"利用する","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"evidence","to":"inference","label":"仮説を検討","kind":"logical.support","detail":"仮説を検討","sense":"a_to_b","legend":"根拠","style":"dashed","color":"#B6D994","opacity":0.78},{"from":"cause","to":"out","label":"因果","detail":"モデルAのスイッチから同じ評価時点の点灯へ至る関係。因果の線を機構で説明する問いと、設定を変えた結果の差を求める問いから読む。モデルBでは観察上の一致だけが残る。","kind":"dynamic.causal","sense":"a_to_b","major":true,"style":"solid","size":8,"color":"#F5B783","legend":"生成・作用","opacity":1},{"from":"condition","to":"mech","label":"作動条件","detail":"条件が機構の作動にどう関わるかを示す。","kind":"meta.reference","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"mech","to":"response","label":"応答値で表す","detail":"入力に応じた機構の応答を値で記述する。Z方向の移動は数値による記述への移行。","kind":"meta.reference","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"response","to":"chance","label":"傾向を示す","detail":"同じ条件で生じうる },{"from":"cf","to":"forecast","label":"別条件で再計算","kind":"dynamic.derivation","detail":"この一回でU=1のままXを0に変える。同じ評価時点でAは消灯、Bは点灯となる。","sense":"a_to_b","legend":"導出","style":"dashed","color":"#A8D6E5","opacity":0.78},{"from":"forecast","to":"effect","label":"二条件の差","kind":"structural.association","detail":"同じ集団・評価時点について、X=1とX=0に設定した二つの結果分布から、点灯率の差を比較する。","sense":"a_to_b","legend":"比較・対応","style":"dashed","color":"#DAC5EC","opacity":0.78},{"from":"ev","to":"identify","label":"資料を照合","kind":"logical.support","detail":"観察資料や実験資料が支持する範囲と、どの仮定を合わせたかで、効果を定められるかを検討する。","sense":"a_to_b","legend":"根拠","style":"dashed","color":"#B6D994","opacity":0.78},{"from":"identify","to":"effect","label":"効果を識別できるか","kind":"meta.reference","detail":"通常運転の同じ資料には、正の効果と効果ゼロの両方が整合する。識別は問いごとに決まる。","sense":"a_to_b","major":true,"color":"#A7B8C8","legend":"参照・説明","style":"dashed","opacity":1},{"from":"telos","to":"purpose","label":"目的から説明","detail":"なぜ入れたのかを、部屋を明るくしようとした目的から説明する。","kind":"meta.reference","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"purpose","to":"act","label":"目指して行う","detail":"行為者は部屋を明るくするためにスイッチを入れた。","kind":"meta.reference","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"mechanism","to":"motor","label":"機構から説明","detail":"筋肉が手指をどう動かしたかを構成部分の働きから説明する。","kind":"meta.reference","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8C8","opacity":0.78},{"from":"motor","to":"act","label":"押し込む","detail":"手指の運動がスイッチを押し込む。","kind":"dynamic.causal","sense":"a_to_b","legend":"生成・作用","style":"solid","color":"#F5B783","opacity":1},{"from":"choice","to":"motor","label":"実行に移す","detail":"スイッチを入れるという選択を身体の運動へ移す。","kind":"dynamic.influence","sense":"a_to_b","legend":"働きかけ","style":"solid","color":"#EDC995","opacity":0.78},{"from":"free","to":"choice","label":"誰が制御したか","detail":"この選択を本人が理由に応じて変え、制御できたかを問う。","kind":"meta.reference","sense":"a_to_b","legend":"参照・説明","style":"dashed","color":"#A7B8 "何がランプを灯したか","body":"操作から一定時間後の点灯を「結果」と決める。配線Aではスイッチが接点を閉じて点灯する。「因果」の一本を、作動条件と機構を通る経路に沿って説明できる。","nodes":["out","cause","condition","mech","operation"],"edges":[["out","cause"],["cause","condition"],["condition","mech"],["mech","operation"],["operation","out"]]},{"title":"同じ記録を生むもう一つの配線","body":"通常運転では制御指令にスイッチが追従する。配線Bでは同じ指令がランプも直接制御するので、スイッチ位置と点灯が一致する。この二股が共通原因や。","nodes":["common","candidate","condition","mech","operation","out"],"edges":[["common","candidate"],["common","condition"],["condition","mech"],["mech","operation"],["operation","out"]]},{"title":"入れた時と切った時の差","body":"人がスイッチ位置だけを固定する。Aの点灯率はオンで100%、オフで0%。Bは指令が半々ならどちらも50%。同じ集団・同じ時点で比べた因果効果はAで100ポイント、Bで0ポイントや。","nodes":["inter","candidate","cause","out","forecast","effect"],"edges":[["inter","candidate"],["candidate","cause"],["cause","out"],["out","forecast"],["forecast","effect"]]},{"title":"どこまで証拠で言えるか","body":"通常運転の記録だけではAもBも成り立つ。適切に割り付けた強制操作の記録があれば、回路の全配線を突き止める前でも、オンとオフの点灯率の差を調べられる。","nodes":["obs","rec","ev","identify","effect","evidence","inference","assume"],"edges":[["obs","rec"],["rec","ev"],["ev","identify"],["identify","effect"],["rec","evidence"],["evidence","inference"],["inference","assume"]]},{"title":"確率の二つの読み方","body":"配線Bで指令のオンとオフが半々なら、点灯の起こりやすさは50％。指令を知らない人がランプを見て、今回の点灯を確かめると、その一回についての確信は変わる。同じ条件で繰り返したときの点灯率は50％のまま。","nodes":["p","chance","cred"],"edges":[["p","chance"],["p","cred"]]},{"title":"この一回で切っていたら","body":"指令がオンと記録された時に、人がスイッチを入れ、ランプが灯ったこの一回に戻る。指令を保ち、スイッチだけ切っていたら、同じ時刻のランプはAなら消え、Bなら灯る。両方とも同じ「結果」の点を読む。","nodes":["out","obs","cf","forecast"],"edges":[["out","obs"],["obs","cf"],["cf","forecast"],["forecast","out"]]}]},{"label":"人の行為","title":"同じ操作の目的・効力・統制・不可避性","steps":[{"title":"何を目指して入れたか","body":"部屋を明るくしたいという目的は、スイッチを入れる今すでにある。ランプが故障して灯らなかった場合にも、この人がその目的で動いたという説明は成り立つ。","nodes":["act","purpose","telos"],"edges":[["act","purpose"],["purpose","telos"]]},{"title":"その操作は点灯に効いたか","body":"同じスイッチを入れる行為でも、配線Aでは点灯を左右し、配線Bでは指令が結果を決める。目的を達したことと、操作が点灯に効いたことは別々に確かめられる。","nodes":["act","cause","out","forecast","effect"],"edges":[["act","cause"],["cause","out"],["out","forecast"],["forecast","effect"]]},{"title":"誰が操作を選べたか","body":"指がスイッチを押すまでを戻って、その選択が本人の理由と統制に基づくかを問う。過去と法則のもとで一意に決まることと自由な選択が両立するかに、二つの立場が答える。","nodes":["choice","motor","act","free","compatQ","det","compat","incompat"],"edges":[["choice","motor"],["motor","act"],["choice","free"],["free","compatQ"],["compatQ","det"],["compatQ","compat"],["compatQ","incompat"]]},{"title":"その結末は避けられたか","body":"将来の点灯を置き、今の選択で回避できたかを考える。さらに論理的運命論では、それを述べた過去の言明がすでに真だったとすれば結末まで必然かを問う。破線は問いをたどる向きや。","nodes":["fateFuture","fateNow","fatePast","fate","purpose","act"],"edges":[["fateFuture","fateNow"],["fateNow","fatePast"],["fate","fateNow"],["fateNow","purpose"],["purpose","act"]]}]},{"label":"三つの読み分け","title":"時間・条件・説明の違い","steps":[{"title":"時間が進む","body":"実際の操作から、一定時間後の点灯までを＋Yへ進む。「行為」の縦書きは文字上方が＋Y、正面が＋X。ここで動いたのは出来事の時点や。","nodes":["act","cause","out"],"edges":[["act","cause"],["cause","out"]]},{"title":"時点を保って条件を替える","body":"同じランプと同じ評価時点を保ち、スイッチをオン／オフにした場合を比べる。一回については反事実の経路、集団の点灯率の差には因果効果の経路を使う。","nodes":["out","obs","cf","forecast","effect"],"edges":[["out","obs"],["obs","cf"],["cf","forecast"],["forecast","out"],["forecast","effect"]]},{"title":"行為を保って説明を替える","body":"同じ「行為」に二方向から戻る。目的論は部屋を明るくしたいという理由から、機械論は手指がスイッチを押す仕組みから説明する。行為の時点も対象も共通や。","nodes":["act","purpose","telos","motor","mechanism"],"edges":[["act","purpose"],["purpose","telos"],["act","motor"],["motor","mechanism"]]}]}],"summary":"スイッチを入れたら、ランプが灯った。スイッチが点灯を引き起こしたのか、それとも別の指令がスイッチとランプの両方を動かしたのか。同じ場面から、何が結果を生んだのか、証拠から何が分かるのか、人は何を選べたのかをたどります。","edition":"1.0.0","revised_at":"2026-11-19T07:52:17Z"}</script><script>

const axis=(v,f)=>{if(Array.isArray(v))return v;if(typeof v!=='string')return f;const j='XYZ'.indexOf((v.toUpperCase().match(/[XYZ]/)||[])[0]);if(j<0)return f;const a=[0,0,0];a[j]=v.includes('-')?-1:1;return a;};
