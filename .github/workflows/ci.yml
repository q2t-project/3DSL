name: CI
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  site-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/site/.node-version
          cache: "npm"
          cache-dependency-path: apps/site/package-lock.json

      - name: Guardrails (repo invariants)
        run: |
          bash scripts/check/no-root-npm.sh
          bash scripts/check/site-npm-sanity.sh

      - name: Print environment
        working-directory: apps/site
        run: |
          echo "Runner: $RUNNER_OS"
          node -v
          npm -v
          pwd
          ls -la

      - name: Install deps (verbose)
        working-directory: apps/site
        run: npm ci --verbose

      - name: Record dependency advisories and verify browser validator
        working-directory: apps/site
        run: |
          npm run audit:report
          npm run check:reconstruction-ajv

      - name: Check Library file publication in isolation
        working-directory: apps/site
        run: node scripts/check/library-files.mjs

      - name: Install bundled Japanese fonts for browser checks
        run: |
          mkdir -p "$HOME/.local/share/fonts/3dsl"
          cp packages/vendor/fonts/noto-sans-jp/*.ttf "$HOME/.local/share/fonts/3dsl/"
          fc-cache -f

      - name: Run build (capture logs)
        shell: bash
        working-directory: apps/site
        run: |
          mkdir -p ci-logs
          npm --loglevel verbose run ci:build 2>&1 | tee ci-logs/ci-build.log

      - name: Check document protection and public embedding
        working-directory: apps/site
        run: node scripts/check/web-defense.mjs

      - name: Check cached module updates
        working-directory: apps/site
        run: node scripts/check/cache-delivery.mjs

      - name: Check public-site failure detection
        working-directory: apps/site
        run: node scripts/check/deployed-site.mjs

      - name: Check Modeler recovery and Viewer texture lifetime
        working-directory: apps/site
        env:
          VIEWER_ASSET_TRIALS: 1
        run: |
          node scripts/check/save-recovery.mjs
          node scripts/check/viewer-assets.mjs

      - name: Check repeated Viewer loads and USB sampler
        working-directory: apps/site
        run: |
          node scripts/check/viewer-load-page.mjs
          node scripts/check/android-viewer-memory-test.mjs

      - name: Verify an independent site snapshot and Library QR requests
        working-directory: apps/site
        run: |
          python3 ../../scripts/ops/test_site_snapshot.py
          snapshot_dir="$RUNNER_TEMP/3dsl-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 ../../scripts/ops/site_snapshot.py create --revision HEAD --dist dist --output "$snapshot_dir"
          python3 "$snapshot_dir/site_snapshot.py" verify "$snapshot_dir"
          node scripts/check/site-recovery.mjs "$snapshot_dir/site"
          node scripts/check/library-qr.mjs

      - name: Type-check the generated site
        working-directory: apps/site
        run: npm run check

      - name: Check candidate visual grammar
        working-directory: apps/site
        run: |
          node scripts/check/visual-grammar-schema.mjs ../../apps/reconstruction/ssot/legend_lab/model.3dss.json
          node scripts/check/visual-grammar-lab.mjs

      - name: Upload build log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: apps/site/ci-logs/
          if-no-files-found: warn
