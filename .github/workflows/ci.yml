name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  site-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Print environment
        run: |
          echo "Runner: $RUNNER_OS"
          node -v
          pnpm -v
          pwd
          ls -la

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Run build (capture logs)
        working-directory: apps/site
        # pipefail がないと tee がパイプの終了コードを 0 に上書きし、ci:dod の失敗が緑になる
        run: |
          set -o pipefail
          mkdir -p ci-logs
          pnpm run ci:dod --if-present 2>&1 | tee ci-logs/ci-build.log

      - name: Upload build log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: apps/site/ci-logs/ci-build.log
          if-no-files-found: warn
